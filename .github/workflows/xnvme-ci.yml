# The kernel-side debs xNVMe's test images are assembled from: today amdgpu
# with the GC 12.1 fixes as DKMS, for the guest. A tag xnvme-ci/v<series>-<n>
# publishes them as a release.
#
# Copyright (c) Simon A. F. Lund <os@safl.dk>
# SPDX-License-Identifier: GPL-2.0
name: xnvme-ci

on:
  push:
    branches: ['xnvme-ci/**']
    tags: ['xnvme-ci/v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # The guest's kernel, whose headers test the DKMS build
  TEST_KVER: 7.3.0-9-generic

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:26.10
    steps:
    - run: apt-get -qy update && apt-get -qy install git
    - uses: actions/checkout@v6
      with:
        fetch-depth: 50
        filter: blob:none
        sparse-checkout: |
          /Makefile
          /COPYING
          /drivers/gpu/drm/amd/
          /xnvme-ci/
        sparse-checkout-cone-mode: false
    - id: v
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        git config --global --add safe.directory "$PWD"
        base=$(awk -F' = ' '$1=="VERSION"{v=$2} $1=="PATCHLEVEL"{p=$2} $1=="SUBLEVEL"{s=$2} END{print v"."p"."s}' Makefile)
        if [ "$REF_TYPE" = tag ]; then
          tag=${REF_NAME#xnvme-ci/v}
          [ "${tag%-*}" = "$(echo "$base" | cut -d. -f1-2)" ] || { echo "::error::tag $REF_NAME is not for $base"; exit 1; }
          deb="$base+xnvme${tag##*-}"
        else
          deb="$base+xnvme0~g$(git rev-parse --short HEAD)"
        fi
        echo "deb=$deb" >> "$GITHUB_OUTPUT"
        echo "$deb"
    - run: bash xnvme-ci/build-amdgpu-dkms.sh out "${{ steps.v.outputs.deb }}"
    - uses: actions/upload-artifact@v6.0.0
      with:
        name: debs
        path: out/*.deb
        if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:26.10
    timeout-minutes: 120
    steps:
    - run: apt-get -qy update && apt-get -qy install git
    - uses: actions/checkout@v6
      with:
        sparse-checkout: xnvme-ci
        filter: blob:none
    - uses: actions/download-artifact@v7.0.0
      with:
        name: debs
        path: debs
    - run: bash xnvme-ci/test-amdgpu-dkms.sh debs/amdgpu-xnvme-*-dkms_*.deb "$TEST_KVER"

  release:
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v7.0.0
      with:
        name: debs
        path: debs
    - env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        cd debs
        sha256sum *.deb > SHA256SUMS
        cat SHA256SUMS
        gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" \
          --notes "Kernel-side packages from $GITHUB_SHA." \
          *.deb SHA256SUMS
