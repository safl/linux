# The kernel-side debs xNVMe's test images are assembled from: this tree as the
# guests' kernel, 7.3.0-xnvme<n>, and amdgpu with the GC 12.1 fixes as DKMS,
# checked against both that kernel and Ubuntu's. cijoe does the work, as
# xnvme-ci/cijoe/workflows/artifacts.yaml, which runs the same way outside
# GitHub; this only runs it and keeps its report. A tag
# xnvme-ci/v<series>-<n> publishes the debs as a release.
#
# Copyright (c) Simon A. F. Lund <os@safl.dk>
# SPDX-License-Identifier: GPL-2.0
name: xnvme-ci

on:
  push:
    branches: ['xnvme-ci/**']
    tags: ['xnvme-ci/v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The kernel takes hours on four cores, and its tree more room than the
  # workspace has, so it is built on /mnt
  artifacts:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.10
      options: -v /mnt:/mnt
    timeout-minutes: 360
    steps:
    - run: apt-get -qy update && apt-get -qy install git pipx
    - uses: actions/checkout@v6
      with:
        fetch-depth: 50
        path: linux
    - id: n
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ "$REF_TYPE" = tag ]; then
          tag=${REF_NAME#xnvme-ci/v}
          [ "${tag%-*}" = 7.3 ] || { echo "::error::tag $REF_NAME is not for 7.3"; exit 1; }
          echo "n=${tag##*-}"
        else
          echo "n=0"
        fi >> "$GITHUB_OUTPUT"
    - name: cijoe, artifacts.yaml
      env:
        XNVME_CI_SRC: /mnt/linux
        XNVME_CI_OUT: /mnt/debs
        XNVME_CI_N: ${{ steps.n.outputs.n }}
      run: |
        git config --global --add safe.directory '*'
        mv linux /mnt/linux
        pipx install --include-deps /mnt/linux/xnvme-ci/cijoe
        cd /mnt/linux/xnvme-ci/cijoe
        ~/.local/bin/cijoe workflows/artifacts.yaml --config configs/default.toml \
          --monitor --output "$GITHUB_WORKSPACE/cijoe-output"
    - uses: actions/upload-artifact@v6.0.0
      if: always()
      with:
        name: cijoe-report
        path: cijoe-output/report.html
        if-no-files-found: warn
    - uses: actions/upload-artifact@v6.0.0
      with:
        name: debs
        path: /mnt/debs/*.deb
        if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v7.0.0
      with:
        name: debs
        path: debs
    - env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        cd debs
        sha256sum *.deb > SHA256SUMS
        cat SHA256SUMS
        gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" \
          --notes "Kernel-side packages from $GITHUB_SHA." \
          *.deb SHA256SUMS
