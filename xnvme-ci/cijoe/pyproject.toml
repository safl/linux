[project]
name = "linux-xnvme-ci-cijoe"
version = "0.1.0"
description = "CIJOE environment that builds and checks the kernel-side debs of xNVMe's test images"
requires-python = ">=3.9"

# As xNVMe pins it, so the scripts move between the two unchanged
dependencies = [
    "cijoe==0.9.61",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
